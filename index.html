<!DOCTYPE html>
<html>

    <title>DIY Tetris</title>

      canvas {

  <body>
    <h1>Tetris game</h1>
    <canvas id = 'canvas' width = '300px' height = '450px'>
    </canvas>
    <script>
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const elementSize = canvas.width / 10 ;
      const screenGrid = [];
      const square = [[1, 1], [1, 1]];
      //PixelProps object
      const PixelProps = {
	x : 0,
        y : 0,
        isFill: true,
	figure: '',
      }           
      
      //Create matrix for field
      function screenGridDefine(){ 
        const columnNumber = 10;
	const stringNumber = 15;
	for (let i = 0; i < stringNumber; i++){
	  screenGrid.push([]);
          for (let j = 0; j < columnNumber; j++){
	    PixelProps.x = i
            screenGrid[i].push(PixelProps);
          }
        }
      }
      console.log(screenGrid);
      //Draw all field
      function drawField(){
	let xInit = 0;
	let yInit = 0;
        for(let string of screenGrid){
	  for(let column of string){
            if( column.PixelProps.isFill ){
	      drawEl(column.PixelProps.x, column.PixelProps.y);
	    }
	  }
	}
      }
      screenGridDefine();
   //   drawField();

      //Drawing one pixel
      function drawEl (x, y){
	ctx.beginPath();
        ctx.fillRect(x, y, elementSize, elementSize);
        ctx.clearRect(x + elementSize / 3, y + elementSize /3, elementSize / 3,  elementSize / 3);
	ctx.closePath();
      }
      //draw figure by array

          for( let pixel of square[i]){
            if (parseInt(pixel)) {
		    console.log(test++);
              drawEl(x, y);
	    }
            x += elementSize;
	  }
        y += elementSize;
        }
      }

     // drawFigure( square );
    </script>
  </body>
</html>
