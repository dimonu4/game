<!DOCTYPE html>
<html>
  <head>
    <title>DIY Tetris</title>
    <style>
      canvas {
	background-color: darkorange;
      }
    </style>
  </head>
  <body>
    <h1>Tetris game</h1>
    <canvas id = 'canvas' width = '300px' height = '450px'>
    </canvas>
    <button id="start">start</button>
    <button id="stop">stop</button>
    <button id='rotate'width='150px'height='150px'>rotate</button>
    <div id = "console">Console</div>
    <script>
      let cnsl = document.getElementById('console')
      function cnsllog(text){
	      cnsl.textContent += `* ${text}`
      }
      const startBtn = document.getElementById('start');
      const stopBtn = document.getElementById('stop');
      const rotateBtn = document.getElementById('rotate');
      startBtn.addEventListener('click', startGame);
      stopBtn.addEventListener('click', stopGame);
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const elementSize = canvas.width / 10 ;
      const xInit = 120;
      const yInit = 0;
      let screenGrid = [];
      let timerId;
      let isFigure = false;
      let timer = 0;
      let leftKeyPressed = false;
      let rightKeyPressed = false;
      let figureOrientation = 'up';
      let currentFigureName;
      const figures = [
	{ name: 'dot',
	  up:   [ [1] ],
          left: [ [1] ],
	  down: [ [1] ],
          right:[ [1] ]
	},
	{ name: 'cube',
	  up:    [ [1, 1],
	           [1, 1] ],
          left:  [ [1, 1],
	           [1, 1] ],
	  down:  [ [1, 1],
	           [1, 1] ],
          right: [ [1, 1],
	           [1, 1] ]
	},
        { name: 'letGL',
	  up:    [ [1, 1],
	           [0, 1],
     	           [0, 1] ],
          left:  [ [1, 1, 1],
 	           [1, 0, 0] ],
	  down:  [ [1, 0],
	           [1, 0],
     	           [1, 1] ],
          right: [ [0, 0, 1],
 	           [1, 1, 1] ],
	},
	{ name: 'letGR',
	  up:     [ [1, 1],
	            [1, 0],
     	            [1, 0] ],
          left:   [ [1, 0, 0],
 	            [1, 1, 1] ],
	  down:   [ [0, 1],
	            [0, 1],
     	            [1, 1] ],
          right:  [ [1, 1, 1],
 	            [0, 0, 1] ],
	},
	{ name: 'letT',
	  up:    [ [0, 1, 0],
	           [1, 1, 1] ],
          left:  [ [0, 1],
 	           [1, 1],
	           [0, 1] ],
	  down:  [ [1, 1, 1],
	           [0, 1, 0] ],
          right: [ [1, 0],
 	           [1, 1],
	           [1, 0] ],
	},
	{ name: 'lightningL',
	  up:    [ [1, 1, 0],
	           [0, 1, 1] ],
          left:  [ [0, 1],
 	           [1, 1],
	           [1, 0] ],
	  down:  [ [1, 1, 0],
	           [0, 1, 1] ],
          right: [ [0, 1],
 	           [1, 1],
	           [1, 0] ],
	},
	{ name: 'lightningR',
	  up:    [ [0, 1, 1],
	           [1, 1, 0] ],
          left:  [ [1, 0],
 	           [1, 1],
	         [0, 1] ],
	  down:  [ [0, 1, 1],
	           [1, 1, 0] ],
          right: [ [1, 0],
 	           [1, 1],
	           [0, 1] ],
	},
	{ name: 'stick',
	  up:    [ [1],
		   [1],
		   [1],
		   [1] ],
	  left:  [ [1,1,1,1] ],
	  down:  [ [1],
	  	   [1],
		   [1],
		   [1] ],
	  right: [ [1,1,1,1] ],
        } 
	];
      const figuresNames = [];
      figures.forEach(figure=>figuresNames.push(figure.name));
      //get object of random figure
      function getRandomFigure(){
        const getRandomIndex = Math.floor( Math.random() * figures.length )
	return figures.find(item=>item.name === figuresNames[getRandomIndex]);
      }
      //PixelProps object
      const PixelProps = {
	x : 0,
        y : 0,
        isFill: false,
	underControl: false,
	isAnchored: false,
      }           
      
      //Create matrix for field
      function screenGridDefine(){ 
        const columnNumber = 10;
	const stringNumber = 15;
	for (let i = 0; i < stringNumber; i++){
          for (let j = 0; j < columnNumber; j++){
	    let clonePixel = Object.assign({}, PixelProps)
	    clonePixel.x = j * elementSize
	    clonePixel.y = i * elementSize
            screenGrid.push(clonePixel);
          }
        }
      }
      //Draw all field
      function drawField(){
	ctx.clearRect(0,0,canvas.width, canvas.height);
        for(let pixel of screenGrid){
	      if( pixel.isFill ){
		drawEl(pixel.x, pixel.y);
	  }
	}
      }

      //Drawing one pixel
      function drawEl (x, y){
	ctx.beginPath();
        ctx.fillRect(x, y, elementSize, elementSize);
        ctx.clearRect(x + elementSize / 3, y + elementSize /3, elementSize / 3,  elementSize / 3);
	ctx.closePath();
      }
      // fill picture by coordinates
      function fillPixel(xFill, yFill){
        const pixel = screenGrid.find( pix => pix.x == xFill && pix.y == yFill);
	pixel.isFill = true;
	pixel.underControl=true;
      }
      // return true when pixel is filled
      function isPixelFill(fx,fy){
	let findPixel = screenGrid.find(pix=>pix.x==fx&&pix.y==fy);
        return findPixel.isFill
      }
      // check space for figure
      function isSpaceForFigure(figure, x, y){
	let count =0;
	let currentX = x;
	let currentY = y;
	for( i=0; i<figure.length;i++){
	  for( j=0; j<figure[i].length;j++ ){
	    if( figure[i][j]==1 && isPixelFill(currentX, currentY )){
              count ++;
	    }
	    currentX+= elementSize;
	  }
	  currentY += elementSize;
	  currentX =x;
	}
	count<1?return true:return false;
      }

      // creating Figure
      function addFigure(x=xInit, y=yInit, orientation='up'){
	let startX =x
	const figureObj = figures.find(fig=>fig.name===currentFigureName) || getRandomFigure();
	currentFigureName = figureObj.name;
	const figure = figureObj[orientation];//array 1or0
	if( !isSpaceForFigure(figure, x, y) ){
	     cnsllog("there is no space");
	};
        for (let i = 0; i < figure.length; i++){
	  for (let j=0; j< figure[i].length; j++){
	    if( figure[i][j] === 1){
	      fillPixel(x, y)
	    }
	    x += elementSize;
	  }
          y += elementSize;
	  x = startX;
	}
	isFigure = true;
	drawField();
      }
      //return next pixel
      function giveNextPixel(pixel, direction){
	switch(direction){
	  case 'down':
            return screenGrid.find( pix => pix.y == pixel.y + elementSize && pix.x == pixel.x)
	    break;
	  case 'right':
            return screenGrid.find( pix => pix.y == pixel.y && pix.x == pixel.x + elementSize )
	    break;
	  case 'left':
            return screenGrid.find( pix => pix.y == pixel.y + elementSize && pix.x == pixel.x - elementSize )
	    break;
        }
      }
      //Checking if figure can move to direction
      function checkFigureAbilityMove(pixels, direction){
	let result = 0;
	switch (direction){
	  case 'down':
            pixels.forEach( pixel => {
              const nextPixel = giveNextPixel(pixel, direction);
	      if(nextPixel === undefined || nextPixel.isAnchored === true ){
              result ++;
              }
	    })
	  break;
	  case 'right':
	    pixels.forEach( pixel => {
              const nextPixel = giveNextPixel(pixel, direction);
	      if(nextPixel === undefined || nextPixel.isAnchored === true ){
              result ++;
	      }
            })
	  break;
          case 'left':
	    pixels.forEach( pixel => {
              const nextPixel = giveNextPixel(pixel, direction);
	      if(nextPixel === undefined || nextPixel.isAnchored === true ){
              result ++;
	      }
            })
	  break;
        }	
        return result > 0 ? false: true
      }
      //Move to direction
      function moveToDirection(pixels, direction){
	switch(direction){
	  case 'down':
	  pixels.sort( (a,b)=> b.y - a.y )
          pixels.forEach(pixel =>{ 
	    const nextPixel = giveNextPixel(pixel,'down');
	    nextPixel.isFill = true;
            nextPixel.underControl = true;
	    pixel.underControl = false;
	    pixel.isFill = false;
	    drawField();
	  })
          break;
	  case 'right':
	  pixels.sort( (a,b)=> b.x - a.x )
          pixels.forEach(pixel =>{ 
	    const nextPixel = giveNextPixel(pixel,'right');
	    nextPixel.isFill = true;
            nextPixel.underControl = true;
	    pixel.underControl = false;
	    pixel.isFill = false;
	    drawField();
	  })
          break;
          case 'left':
	  pixels.sort( (a,b)=> a.x - b.x )
          pixels.forEach(pixel =>{ 
	    const nextPixel = giveNextPixel(pixel,'left');
	    nextPixel.isFill = true;
            nextPixel.underControl = true;
	    pixel.underControl = false;
	    pixel.isFill = false;
	    drawField();
	  })
          break;
	}
      }
      //Anchor figure and set isFigure to false
      function anchorFigure(pixels){
        pixels.forEach(pixel => {
	  pixel.isAnchored = true;
	  pixel.underControl=false;
	})
	isFigure = false;
	timer =-1;
        cnsllog('figure anchored');
	currentFigureName=undefined;
	figureOrientation = 'up';
      }
      //return pixels for moving
      function getPixelsForMoving(){
        return screenGrid.filter((pixel)=> pixel.isFill === true && pixel.isAnchored === false);
      }
      //return anchored pixels
      function getAnchoredPixels(){
	return screenGrid.filter((pixel)=> pixel.isAnchored === true);
      }
     //return unanchored pixels
      function getUnAnchoredPixels(){
	return screenGrid.filter((pixel)=> pixel.isAnchored === false && pixel.isFill === true);
      } 
      // return controlled pixels
      function getFigure(){
	return screenGrid.filter(pixel=> pixel.underControl=== true)
      }
      //fall down every second
      function makeFallDown(){
	const pixelsForMoving = getPixelsForMoving();
	const canFigureMove = checkFigureAbilityMove(pixelsForMoving, 'down');
	if( canFigureMove ){
	  moveToDirection(pixelsForMoving, 'down');
	} else if ( !canFigureMove && pixelsForMoving.find(pix => pix.x === xInit && pix.y === yInit)){
	  gameOver();
          cnsllog('gameover man')
	} else {
           anchorFigure(pixelsForMoving);
	}
      }
      //checking if lines can be destroy
      function deleteLines(){
	let isDel = false;
	let deletedLines =[];
        const anchoredPixels = getAnchoredPixels();
	  for( let i=0; i<canvas.height; ){
	    const line = anchoredPixels.filter(pixel=>pixel.y === i);
	    if(line.length === canvas.width/elementSize){
	      isDel = true;
	      deletedLines.push(line);
	      line.forEach(pixel=>{
	      pixel.isFill= false;
	      })
	    }
	    i += elementSize;
	  }
	if ( isDel ){
	  anchoredPixels.forEach(pixel=>pixel.isAnchored = false)
	  console.log("lines deleted")
	  return deletedLines;
	}
      }
      //falldown pixels
      function fallDownPixels(pixels){
        pixels.sort((a,b)=> b.y - a.y)
	pixels.forEach(pixel=>{
	  pixel.isFill = false;
	  let nextPixel = giveNextPixel(pixel,'down');
	  nextPixel.isFill = true;
	  nextPixel.isAnchored = true;
	})
      }
      //fall dawn field
      function fallDownLines(lines){
	lines.forEach(line=>{
          const unAnchoredPixels = getUnAnchoredPixels();
	  const pixelsAboveLine = unAnchoredPixels.filter(pixel=> pixel.y < line[0].y && pixel.underControl === false)
	  fallDownPixels(pixelsAboveLine)
	})
      }
      //rotating Figure
      function rotateFigure(){
	const orientations = ['up', 'left', 'down', 'right'];
	const figuresPixels = getFigure();//array of pixels
	const currentOrientationIndex = orientations.indexOf(figureOrientation);
	const nextOrientationIndex = currentOrientationIndex === orientations.length-1?0:currentOrientationIndex+1;
	const nextOrientation = orientations[nextOrientationIndex];
	figureOrientation = nextOrientation;
	figuresPixels.filter((a,b)=>a.x-b.x);
        const xF = figuresPixels[0].x;
	figuresPixels.filter((a,b)=>a.y-b.y);
	const yF = figuresPixels[0].y;
	figuresPixels.forEach(pixel=>{
          pixel.isFill = false;
	  pixel.underControl = false
	});
	addFigure(xF, yF, nextOrientation);
      }
      // tic of game
      function gameTic( ) {
        if( !isFigure ) {
	  addFigure()
	}
        if( timer > 0 ){
	  makeFallDown();
	}
	if( timer < 0){
	  const lines = deleteLines();
	    if( lines && lines.length >0){
	    fallDownLines(lines);
	   }
	}
        drawField();
	timer ++;
	cnsllog('tic');
      }
      // start of game
      function startGame(){
        screenGridDefine();
	timerId = setInterval( gameTic, 1000);
	startBtn.blur();
      }
     // stop button handle
      function stopGame(){
	timer =0;
	screenGrid = [];
	clearInterval(timerId);
	isFigure = false;
	stopBtn.blur();
      }
     // game over
      function gameOver(){
	clearInterval(timerId)
      }
     // controll
      function keyListener(event){
	console.log(event);
	const pixels = getPixelsForMoving();
	let canFigureMove;
	switch(event.key){
          case 'ArrowRight':
	    canFigureMove = checkFigureAbilityMove(pixels, 'right');
	    if( canFigureMove ){
	      moveToDirection(pixels, 'right');
            }
            console.log('moved right')
	    break;
	  case 'ArrowLeft':
       	    canFigureMove = checkFigureAbilityMove(pixels, 'left');
	    if( canFigureMove ){
	      moveToDirection(pixels, 'left');
            }
            console.log('moved left')
	    break;
          case 'ArrowDown':
	    canFigureMove = checkFigureAbilityMove(pixels, 'down');
	    if( canFigureMove ){
	      moveToDirection(pixels, 'down');
            }
            console.log('moved down')
	    break;
	  case ' ' :

	    rotateFigure();
	}
      }
      //EventListeners
      document.addEventListener('dblclick', (e)=>e.preventDefault())
      document.addEventListener('keydown', keyListener)
      document.addEventListener('pointerdown', (e)=>{
	const keyE = e.clientX < window.innerWidth/2?"ArrowLeft":"ArrowRight";
        const event = new KeyboardEvent("keydown",{
	  key: keyE
	});
	document.dispatchEvent(event)
      })
      rotateBtn.addEventListener('click', ()=>{
	const event = new KeyboardEvent("keydown",{
	  key: ' '
	});
	document.dispatchEvent(event)
      });
    </script>
  </body>
</html>
