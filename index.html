<!DOCTYPE html>
<html>
  <head>
    <title>DIY Tetris</title>
    <style>
      canvas {
	background-color: darkorange;
      }
    </style>
  </head>
  <body>
    <h1>Tetris game</h1>
    <canvas id = 'canvas' width = '300px' height = '450px'>
    </canvas>
    <script>
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const elementSize = canvas.width / 10 ;
      const screenGrid = [];
      let gameStatus;

      //PixelProps object
      const PixelProps = {
	x : 0,
        y : 0,
        isFill: false,
	underControl: false,
	isAnchored: false,
      }           
      
      //Create matrix for field
      function screenGridDefine(){ 
        const columnNumber = 10;
	const stringNumber = 15;
	for (let i = 0; i < stringNumber; i++){
	  screenGrid.push([]);
          for (let j = 0; j < columnNumber; j++){
	    let clonePixel = Object.assign({}, PixelProps)
	    clonePixel.x = j * elementSize
	    clonePixel.y = i * elementSize
            screenGrid[i].push(clonePixel);
          }
        }
      }
      //Draw all field
      function drawField(){
	let xInit = 0;
	let yInit = 0;
        for(let string of screenGrid){
	  for(let column of string){
	      if( column["isFill"] ){
		drawEl(column["x"], column["y"]);
	    }
	  }
	}
      }

      //Drawing one pixel
      function drawEl (x, y){
	ctx.beginPath();
        ctx.fillRect(x, y, elementSize, elementSize);
        ctx.clearRect(x + elementSize / 3, y + elementSize /3, elementSize / 3,  elementSize / 3);
	ctx.closePath();
      }
      // tic of game
      function gameTic( ) {
	ctx.clearRect(0,0,canvas.widht, canvas.height);
        drawField();
	      console.log('tic');
      }
      // start of game
      function startGame(){
        screenGridDefine();
	gameStatus = setInterval( gameTic, 1000);
      }
      startGame();
    </script>
  </body>
</html>
