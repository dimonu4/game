<!DOCTYPE html>
<html>
  <head>
    <title>DIY Tetris</title>
    <style>
      canvas {
	background-color: darkorange;
      }
    </style>
  </head>
  <body>
    <h1>Tetris game</h1>
    <canvas id = 'canvas' width = '300px' height = '450px'>
    </canvas>`
    <script>
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const elementSize = canvas.width / 10 ;
      
      function drawEl (x, y){
	ctx.beginPath();
        ctx.fillRect(x, y, elementSize, elementSize);
        ctx.clearRect(x + elementSize / 3, y + elementSize /3, elementSize / 3,  elementSize / 3);
	ctx.closePath();
      }

      function drawElSquare() {
	ctx.beginPath();
	drawEl (0,0);
	ctx.closePath();
      }
      drawElSquare();
    </script>
  </body>
</html>
