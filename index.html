<!DOCTYPE html>
<html>
  <head>
    <title>DIY Tetris</title>
    <style>
      canvas {
	background-color: darkorange;
      }
    </style>
  </head>
  <body>
    <h1>Tetris game</h1>
    <canvas id = 'canvas' width = '300px' height = '450px'>
    </canvas>
    <script>
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const elementSize = canvas.width / 10 ;
      const screenGrid = [];
      let timerId;
      let isFigure = false;
      //PixelProps object
      const PixelProps = {
	x : 0,
        y : 0,
        isFill: false,
	underControl: false,
	isAnchored: false,
      }           
      
      //Create matrix for field
      function screenGridDefine(){ 
        const columnNumber = 10;
	const stringNumber = 15;
	for (let i = 0; i < stringNumber; i++){
          for (let j = 0; j < columnNumber; j++){
	    let clonePixel = Object.assign({}, PixelProps)
	    clonePixel.x = j * elementSize
	    clonePixel.y = i * elementSize
            screenGrid.push(clonePixel);
          }
        }
      }
      //Draw all field
      function drawField(){
	ctx.clearRect(0,0,canvas.widht, canvas.height);
	let xInit = 0;
	let yInit = 0;
        for(let pixel of screenGrid){
	      if( pixel.isFill ){
		drawEl(pixel.x, pixel.y);
	  }
	}
      }

      //Drawing one pixel
      function drawEl (x, y){
	ctx.beginPath();
        ctx.fillRect(x, y, elementSize, elementSize);
        ctx.clearRect(x + elementSize / 3, y + elementSize /3, elementSize / 3,  elementSize / 3);
	ctx.closePath();
      }
      // creating Figure
      function addFigure(){
        const figures = {dot: [ [1] ], cube: [ [1, 1],[1, 1] ] }
	const figure = figures.dot;
	const xInit = 120;
	const yInit = 0;
	const initPixel = screenGrid.find( pixel => pixel.x == xInit && pixel.y == yInit )
	
        for (let i =0; i < figure.length; i++){
	  for (let j=0; j< figure[i].length; j++){
		  console.log("hi")
	  }
	}
	initPixel.isFill = true;
	    
	console.log('figure added');
	isFigure = true;
      }
      // tic of game
      function gameTic( ) {
        if( !isFigure ) {
	  addFigure()
	}
        drawField();
	console.log('tic');
      }
      // start of game
      function startGame(){
        screenGridDefine();
	timerId = setInterval( gameTic, 1000);
	
      }
      startGame();
    </script>
  </body>
</html>
