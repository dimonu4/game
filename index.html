  <body>
    <h1>Tetris game</h1>
    <canvas id = 'canvas' width = '300px' height = '450px'>
    </canvas>`
    <script>
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      const elementSize = canvas.width / 10 ;
      const square = [[0, 1], [1, 1]];
      
      function drawEl (x, y){
	ctx.beginPath();
        ctx.fillRect(x, y, elementSize, elementSize);
        ctx.clearRect(x + elementSize / 3, y + elementSize /3, elementSize / 3,  elementSize / 3);
	ctx.closePath();
      }

      function drawFigure( figure ) {
	ctx.clearRect(0,0,canvas.widht, canvas.height);
	let initX = canvas.width / 2 - elementSize;
	let y = 0;
        for( let i = 0; i < square.length; i++ ){
          let x = initX;
          for( let pixel in square[i]){
            if (parseInt(pixel)) {
		    console.log(pixel);
              drawEl(x, y);
	    }
            x += elementSize;
	  }
        y += elementSize;
        }
      }

      drawFigure( square );
    </script>
  </body>
</html>
